<header class="navbar">
  <div class="nav-container">
    <div class="brand">
      <a routerLink="/" class="logo">
        <span class="logo-icon">🎟️</span>
        <span class="logo-text">UniEvents</span>
      </a>
    </div>

    <nav class="nav-links">
      <a routerLink="/events" routerLinkActive="active" class="nav-link">Events</a>
      @if (authService.isAuthenticatedSignal()) {
        <a routerLink="/bookings" routerLinkActive="active" class="nav-link">My Bookings</a>
        @if (authService.isAdminSignal()) {
          <a routerLink="/admin" routerLinkActive="active" class="nav-link nav-link-admin">Admin</a>
        }
      }
    </nav>

    <div class="nav-auth">
      @if (authService.isAuthenticatedSignal()) {
        <div class="user-badge">
          <span class="user-name">{{ authService.currentUser()?.name }}</span>
          <span class="role-tag" [class.admin-tag]="authService.isAdminSignal()">
            {{ authService.currentUser()?.role }}
          </span>
        </div>
        <button type="button" class="btn btn-outline" (click)="onLogout()">Sign Out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="btn btn-ghost">Sign In</a>
        <a routerLink="/register" routerLinkActive="active" class="btn btn-primary-nav">Register</a>
      }
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet />
</main>
